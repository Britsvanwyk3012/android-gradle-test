name: Round Trip Text Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          test -s test-source.txt
          grep -q "BUY & SELL GITHUB ROUND-TRIP TEST" test-source.txt
          cat test-source.txt
      - name: Package source
        run: |
          mkdir out
          cp test-source.txt out/
          zip -q roundtrip-source.zip out/test-source.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: roundtrip-source-text
          path: roundtrip-source.zip
          archive: false
