name: ZIP Round Trip Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect ZIP
        run: |
          mkdir extracted
          unzip -q transfer-test/Buy_and_Sell_V11.29_Source_Snippet_GitHub_Test.zip -d extracted
          echo "=== FILES IN ZIP ==="
          find extracted -type f -print | sort
          echo "=== ZIP CONTENTS ==="
          unzip -l transfer-test/Buy_and_Sell_V11.29_Source_Snippet_GitHub_Test.zip

      - name: Package extracted source
        run: |
          cd extracted
          zip -qr ../roundtrip-source.zip .

      - name: Upload round-trip artifact
        uses: actions/upload-artifact@v7
        with:
          name: roundtrip-source
          path: roundtrip-source.zip
          archive: false
